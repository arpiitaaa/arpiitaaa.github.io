<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Arpita Srivastava – Data Science & AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Figtree:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#ececec;--ink:#111;--muted:#5f5856;--card:#f7efec;--accent:#d9593f;--frame:#cfd0d4;
--display:"Anton",Impact,"Arial Narrow",sans-serif;--body:"Figtree",system-ui,sans-serif;--mono:"Space Mono",ui-monospace,Menlo,monospace;
--rh:50px;--ph:3px;--pb:8px;--rs:39px;--u:8px}
*{box-sizing:border-box;margin:0}
html{background:var(--bg);transition:background .5s}
body{font-family:var(--body);color:var(--ink)}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
a{color:inherit}
header{position:fixed;z-index:20;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:calc(20px + env(safe-area-inset-top,0px)) 28px 0;pointer-events:none}
header>*{pointer-events:auto}
.logo{font:400 23px/1 var(--display);text-decoration:none}.logo sup{font-size:.4em}
.seg{display:flex;background:rgba(255,255,255,.85);border-radius:99px;padding:4px;box-shadow:0 8px 24px -12px rgba(0,0,0,.25)}
.seg button{font:500 14px var(--body);border:0;background:none;padding:7px 16px;border-radius:99px;cursor:pointer;color:var(--ink)}
.seg button[aria-pressed=true]{background:#111;color:#fff}
#track{height:600vh;position:relative}
#stage{position:sticky;top:0;height:100vh;height:100svh;overflow:hidden}
.names{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:1;pointer-events:none;font-family:var(--display);line-height:.82;text-transform:uppercase;white-space:nowrap;-webkit-text-stroke:.03em currentColor}
.names span{display:block;flex:none}
#glow{position:absolute;z-index:0;left:50%;top:50%;width:var(--gw2,900px);height:calc(var(--H)*1.34);translate:-50% -50%;border-radius:50%;filter:blur(30px) saturate(1.25);opacity:calc(var(--ga,0)*var(--gv,1));transition:opacity .6s,width .2s;pointer-events:none;
 background:radial-gradient(farthest-side at 19% 46%,var(--g1) 20%,transparent 78%),radial-gradient(farthest-side at 50% 9%,var(--g2) 18%,transparent 76%),radial-gradient(farthest-side at 86% 58%,var(--g3) 22%,transparent 78%),radial-gradient(farthest-side at 50% 94%,var(--g4) 18%,transparent 76%);animation:gturn 16s ease-in-out infinite alternate}
@keyframes gturn{from{rotate:-4deg;scale:1}to{rotate:4deg;scale:1.05}}
.orbit{position:absolute;left:50%;top:50%;width:0;height:0;opacity:0;transition:opacity .6s;pointer-events:none}
.tile{position:absolute;left:0;top:0;border-radius:calc(var(--Wp)*.032);overflow:hidden;box-shadow:0 18px 34px -16px rgba(0,0,0,.45);background:var(--c,#ddd);will-change:transform}
.tile .vis{position:absolute;inset:0}
.tile img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 100%;background:linear-gradient(#f6f6f6,#e4e4e4)}
body[data-bd=glow]{--ga:1}
body[data-bd=orbit] .orbit{opacity:var(--oo,1)}
body[data-bd=glow] .names,body[data-bd=orbit] .names{opacity:0!important}
.names{transition:opacity .45s}
#ground{position:absolute;z-index:2;left:50%;top:50%;width:var(--gw,300px);height:0;translate:-50% 0;pointer-events:none}
#ground::before,#ground::after{content:"";position:absolute;border-radius:50%}
#ground::before{left:4%;right:4%;top:calc(var(--H)/2 + 20px);height:20px;background:radial-gradient(ellipse at center,rgba(30,12,8,.42),transparent 70%);filter:blur(6px);animation:gsh 6.8s ease-in-out infinite}
#ground::after{left:-14%;right:-14%;top:calc(var(--H)/2 + 6px);height:84px;background:radial-gradient(ellipse at center,rgba(60,30,20,.2),transparent 72%);filter:blur(22px);animation:gsh 6.8s ease-in-out infinite}
@keyframes gsh{0%,100%{scale:calc(1 - .06*var(--fl,1)) calc(1 - .14*var(--fl,1));opacity:calc(1 - .28*var(--fl,1))}50%{scale:calc(1 + .05*var(--fl,1)) calc(1 + .1*var(--fl,1));opacity:1}}
#asm{animation:floaty 6.8s ease-in-out infinite}
@keyframes floaty{0%,100%{translate:0 calc(-9px*var(--fl,1))}50%{translate:0 calc(9px*var(--fl,1))}}
/* 3D foldable: always opens sideways, right to left */
#dev{position:absolute;left:50%;top:50%;width:0;height:0;z-index:3;perspective:2600px}
#asm{position:relative;width:0;height:0;transform-style:preserve-3d}
#pR,#pL{position:absolute;width:var(--Wp);height:var(--H);top:calc(var(--H)/-2)}
#pR{left:0;transform:translateZ(-2px)}
#pL{right:0;transform-origin:100% 50%;transform-style:preserve-3d}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.bk{transform:rotateY(180deg)}
.fm{background:var(--frame);transition:background .5s;width:100%;height:100%}
.bz{background:#0a0a0a;width:100%;height:100%}
.scr{position:relative;background:#fff;width:100%;height:100%;overflow:hidden}
.hl{border-radius:var(--rh) var(--R) var(--R) var(--rh);padding:4px 4px 4px var(--ph)}
.hl .bz{border-radius:max(0px,calc(var(--rh) - 4px)) calc(var(--R) - 4px) calc(var(--R) - 4px) max(0px,calc(var(--rh) - 4px));padding:10px 10px 10px var(--pb)}
.hl .scr{border-radius:var(--rs) calc(var(--R) - 14px) calc(var(--R) - 14px) var(--rs)}
.hr{border-radius:var(--R) var(--rh) var(--rh) var(--R);padding:4px var(--ph) 4px 4px}
.hr .bz{border-radius:calc(var(--R) - 4px) max(0px,calc(var(--rh) - 4px)) max(0px,calc(var(--rh) - 4px)) calc(var(--R) - 4px);padding:10px var(--pb) 10px 10px}
.hr .scr{border-radius:calc(var(--R) - 14px) var(--rs) var(--rs) calc(var(--R) - 14px)}
.hr .scr::after,.hl:not(.bk) .scr::after{content:"";position:absolute;top:0;bottom:0;width:16px;opacity:var(--o,0);pointer-events:none;z-index:6}
.hr .scr::after{right:0;background:linear-gradient(90deg,transparent,rgba(0,0,0,.12))}
.hl:not(.bk) .scr::after{left:0;background:linear-gradient(270deg,transparent,rgba(0,0,0,.12))}
#pR::before,#pR::after{content:"";position:absolute;right:-5px;width:5px;background:var(--frame);border-radius:0 4px 4px 0}
#pR::before{top:17%;height:10%}
#pR::after{top:31%;height:6.5%}
.sc,.fx{position:absolute;width:var(--cw)}
.sc{will-change:transform;background:#f4f3ef;color:#111;animation:vin .45s ease both}
.sc.nov{animation:none}
@keyframes vin{from{opacity:0}}
.fx{height:var(--sh);pointer-events:none;z-index:5}
.fx>*{pointer-events:auto}
.off,.off *{pointer-events:none!important}
.sb{position:absolute;top:12px;left:18px;right:18px;display:flex;justify-content:space-between;font:600 12px var(--body);pointer-events:none!important;color:#fff;transition:color .25s}
.fx.lt .sb{color:#111}
.nav{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);display:flex;background:rgba(70,70,70,.5);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-radius:99px;padding:4px;box-shadow:0 6px 18px -8px rgba(0,0,0,.4),inset 0 0 0 1px rgba(255,255,255,.12)}
.nav button{font:600 12px var(--body);border:0;background:none;padding:8px 12px;border-radius:99px;cursor:pointer;color:#fff;transition:background .2s,color .2s}
.nav button.on{background:#fff;color:#111}
.m .nav button{padding:7px 7px;font-size:10px}
/* ---------- screen content (u = 1% of screen width) ---------- */
.lab{display:block;font:700 max(8px,calc(var(--u)*1.05))/1.2 var(--mono);letter-spacing:.06em;text-transform:uppercase}
.sc h1,.sc h2,.sc h3{font-family:var(--display);font-weight:400;text-transform:uppercase}
.sc p{font-size:max(11px,calc(var(--u)*1.55));line-height:1.45}
.b{border:0;font:600 max(11px,calc(var(--u)*1.4)) var(--body);padding:.85em 1.4em;border-radius:99px;background:#111;color:#fff;cursor:pointer;text-decoration:none;display:inline-block}
.b.g{background:#e9e8e4;color:#111}
.b.w{background:#fff;color:#111}
.dk{background:#0b0b0b;color:#fff}
.hero{height:var(--sh);display:grid;grid-template-columns:1fr 1fr;position:relative;background:#fff}
.hero .t{padding:calc(var(--u)*4) calc(var(--u)*3) calc(var(--u)*7);display:flex;flex-direction:column;justify-content:flex-end;position:relative}
.hero .lab{position:absolute;top:calc(var(--u)*8.5);left:calc(var(--u)*3);right:calc(var(--u)*3);font-size:max(10px,calc(var(--u)*1.25));letter-spacing:.1em;line-height:1.5}
.hero h1{font-size:var(--hn);line-height:.9}
.hero p{margin:14px 0;max-width:34ch}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.pic{position:relative;background:linear-gradient(#f6f6f6,#e9e9e9);overflow:hidden}
.pic img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 100%}
.stats{padding:calc(var(--u)*4) calc(var(--u)*3.5) calc(var(--u)*5)}
.stats .grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:calc(var(--u)*2);margin-top:calc(var(--u)*3.5)}
.stats b{display:block;font:400 max(26px,calc(var(--u)*7))/1 var(--display)}
.stats i{display:block;font:700 max(8px,calc(var(--u)*1))/1.3 var(--mono);text-transform:uppercase;letter-spacing:.05em;margin-top:8px;font-style:normal}
.wh{padding:calc(var(--u)*5) calc(var(--u)*3.5) calc(var(--u)*3);display:flex;justify-content:space-between;align-items:flex-end;gap:12px;background:#0b0b0b;color:#fff}
.wh h2{font-size:max(32px,calc(var(--u)*9.5));line-height:.95}
.pill{border:0;background:#222;color:#fff;font:600 max(11px,calc(var(--u)*1.4)) var(--body);padding:.8em 1.3em;border-radius:99px;cursor:pointer;white-space:nowrap;margin-bottom:8px}
.row{display:grid;grid-template-columns:1fr 1fr;height:calc(var(--sh)*.5);cursor:pointer}
.vis{position:relative;overflow:hidden;background:linear-gradient(135deg,color-mix(in srgb,var(--c) 62%,#000),color-mix(in srgb,var(--c) 70%,#fff))}
.vis svg{position:absolute;inset:0;width:100%;height:100%}
.pnl{background:var(--c);color:#fff;display:grid;align-content:center;padding:calc(var(--u)*2) calc(var(--u)*3.2);position:relative;overflow:hidden}
.pnl>*{grid-area:1/1}
.num{font:400 max(70px,calc(var(--u)*21))/.9 var(--display);transition:opacity .35s,transform .45s cubic-bezier(.2,.8,.2,1)}
.info{opacity:0;transform:translateY(14px);pointer-events:none;transition:opacity .35s .1s,transform .45s .1s cubic-bezier(.2,.8,.2,1)}
.info h3{font-size:max(20px,min(calc(var(--u)*6.4),calc(var(--sh)*.07)));line-height:1;margin:.3em 0 .35em;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.info p{max-width:34ch;font-weight:600;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.vp{margin-top:12px;background:none;border:0;color:#fff;font:700 max(9px,calc(var(--u)*1.1)) var(--mono);letter-spacing:.06em;text-transform:uppercase;cursor:pointer;padding:0}
.row.on .num{opacity:0;transform:translateY(-14px) scale(.94)}
.row.on .info{opacity:1;transform:none;pointer-events:auto}
.svc{padding:calc(var(--u)*7) calc(var(--u)*3.5) 0}
.svc .rows{display:grid;gap:calc(var(--u)*.9);margin-top:calc(var(--u)*1.5)}
.sv{display:grid;grid-template-columns:calc(var(--u)*4) 1.1fr 1fr;align-items:center;gap:calc(var(--u)*1.5);background:#1b1b1b;border-radius:14px;padding:calc(var(--u)*1.8) calc(var(--u)*2.2)}
.sv h3{font-size:max(20px,calc(var(--u)*3.6))}
.sv p{font-weight:600}
.sv .lab{color:#ddd}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:calc(var(--u)*1.5)}
.chips span{background:#1b1b1b;border-radius:99px;padding:.7em 1.3em;font:600 max(10px,calc(var(--u)*1.3)) var(--body)}
.cta{margin:calc(var(--u)*4.5) calc(var(--u)*3.5) 0;background:#fff;color:#111;border-radius:18px;padding:calc(var(--u)*2.6) calc(var(--u)*3);display:flex;justify-content:space-between;align-items:center;gap:14px}
.cta h3{font-size:max(20px,calc(var(--u)*3.4))}
.svcend{height:calc(var(--u)*9)}
.sec{padding:calc(var(--u)*6) calc(var(--u)*4.5) 0}
.sec h2{font-size:max(30px,calc(var(--u)*7.5));line-height:1;margin-bottom:calc(var(--u)*2.5)}
.lead{max-width:56ch;color:var(--muted);font-size:max(12px,calc(var(--u)*1.8))!important;line-height:1.55!important}
.arc a,.arc button{display:grid;grid-template-columns:calc(var(--u)*4) 1.2fr 1.4fr auto;gap:calc(var(--u)*2);align-items:center;width:100%;text-align:left;background:none;border:0;border-top:1px solid rgba(0,0,0,.14);padding:calc(var(--u)*2) 0;cursor:pointer;font:inherit;color:inherit;text-decoration:none}
.arc>:last-child{border-bottom:1px solid rgba(0,0,0,.14)}
.arc h3{font-size:max(20px,calc(var(--u)*3.4))}
.arc small{font-size:max(11px,calc(var(--u)*1.4));color:var(--muted)}
.arc b{font:700 max(10px,calc(var(--u)*1.3)) var(--mono)}
.arc a:hover h3,.arc button:hover h3{color:var(--accent)}
.nums{display:flex;gap:calc(var(--u)*4);flex-wrap:wrap;margin-top:calc(var(--u)*3)}
.nums b{display:block;font:400 max(30px,calc(var(--u)*5.2))/1 var(--display);color:var(--accent)}
.nums span{font-size:max(11px,calc(var(--u)*1.4));color:var(--muted);display:block;max-width:20ch;margin-top:6px}
.xp{display:grid;grid-template-columns:calc(var(--u)*18) 1fr;gap:16px;padding:18px 0;border-top:1px solid rgba(0,0,0,.14)}
.xp>span{font:700 max(9px,calc(var(--u)*1.05)) var(--mono);letter-spacing:.04em;text-transform:uppercase;color:var(--muted);padding-top:6px}
.xp h3{font-size:max(18px,calc(var(--u)*2.8));line-height:1.1}
.xp small{display:block;font-size:max(11px,calc(var(--u)*1.5));margin:4px 0 6px}
.xp p{color:var(--muted);max-width:60ch}
.card{background:#fff;border-radius:20px;padding:calc(var(--u)*2.4);display:flex;flex-direction:column;gap:10px}
.card h3{font-size:max(20px,calc(var(--u)*3))}
.card p{color:var(--muted)}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tags i{font-style:normal;font-size:max(10px,calc(var(--u)*1.3));background:#f1efea;border-radius:99px;padding:4px 10px}
.certs{list-style:none;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(calc(var(--u)*24),1fr));gap:10px}
.certs li{background:#fff;border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.certs small{font-size:max(10px,calc(var(--u)*1.25));color:var(--muted)}
.certs b{font:600 max(11px,calc(var(--u)*1.5))/1.35 var(--body)}
.skills{display:grid;grid-template-columns:repeat(3,1fr);gap:calc(var(--u)*2.5)}
.skills h3{font-size:max(17px,calc(var(--u)*2.5));margin-bottom:6px}
.skills p{color:var(--muted)}
.abend{height:calc(var(--u)*7)}
.contact{height:var(--sh);display:grid;grid-template-columns:1fr 1fr;background:#111;color:#fff}
.contact .t{padding:calc(var(--u)*5) calc(var(--u)*3);display:flex;flex-direction:column;justify-content:space-between}
.contact h2{font-size:var(--hn);line-height:.92}
.contact h2 em{font-style:normal;color:#f2c230}
.mail{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.mail a.e{font:500 max(14px,calc(var(--u)*2.7)) var(--body);text-decoration:none;word-break:break-all}
.soc{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:calc(var(--u)*6)}
.soc a{background:#262626;color:#fff;text-decoration:none;font:600 max(10px,calc(var(--u)*1.3)) var(--body);padding:.9em 1.4em;border-radius:99px}
.contact small{font-size:max(10px,calc(var(--u)*1.2));opacity:.6;margin-top:10px;display:block}
/* project page */
.dtop{display:grid;grid-template-columns:1fr 1fr;min-height:calc(var(--sh)*.5);background:var(--c)}
.dl{color:#fff;padding:max(54px,calc(var(--u)*9)) calc(var(--u)*3.5) calc(var(--u)*4);display:flex;flex-direction:column;justify-content:center;gap:10px}
.dl h1{font-size:max(24px,calc(var(--u)*var(--k,9.5)));line-height:.95;overflow-wrap:anywhere}
.dm{background:#f4f3ef;padding:calc(var(--u)*4) calc(var(--u)*3.5) 0}
.mrow{display:grid;grid-template-columns:1fr 1.6fr 1fr;gap:calc(var(--u)*2);border-top:1px solid rgba(0,0,0,.14);padding-top:calc(var(--u)*3)}
.mrow p{font-size:max(13px,calc(var(--u)*2.2));line-height:1.2;margin-top:8px;overflow-wrap:anywhere}
.drow{display:grid;grid-template-columns:1fr 1fr;gap:calc(var(--u)*4);margin-top:calc(var(--u)*4)}
.drow h2{font-size:max(22px,calc(var(--u)*3.5));line-height:1}
.dread{padding:calc(var(--u)*5) calc(var(--u)*3.5) 0;display:grid;grid-template-columns:1fr 2fr;gap:calc(var(--u)*4)}
.md{max-width:64ch}
.md h2,.md h3,.md h4{margin:1.1em 0 .4em;line-height:1.05}
.md h2{font-size:max(20px,calc(var(--u)*3))}.md h3{font-size:max(17px,calc(var(--u)*2.3))}.md h4{font-size:max(15px,calc(var(--u)*1.9))}
.md>:first-child{margin-top:0}
.md p,.md li{color:#333;margin-bottom:.7em}
.md ul,.md ol{padding-left:1.3em;margin-bottom:.7em}
.md code{font:400 .88em var(--mono);background:#e9e7e1;border-radius:5px;padding:.1em .35em}
.md pre{background:#111;color:#eee;border-radius:12px;padding:14px;overflow-x:auto;margin-bottom:1em}
.md pre code{background:none;padding:0;font-size:max(10px,calc(var(--u)*1.25))}
.md .tbl{overflow-x:auto;margin:0 0 1.1em;max-width:100%;-webkit-overflow-scrolling:touch}
.md table{border-collapse:collapse;min-width:100%;font-size:.9em}
.md th,.md td{text-align:left;padding:.5em .8em .5em 0;border-bottom:1px solid #d9d6cf;vertical-align:top}
.md th{font-weight:600;white-space:nowrap;border-bottom:2px solid #111}
.md td code{white-space:nowrap}
.md img{max-width:100%;border-radius:12px;margin:.5em 0}
.md a{color:var(--accent)}
.dact{padding:calc(var(--u)*4) calc(var(--u)*3.5) max(104px,calc(var(--u)*12));display:flex;gap:10px;flex-wrap:wrap}
.dpad{height:calc(var(--u)*0)}
/* mobile content */
.m .hero .t{padding-bottom:64px}
.m .hero p{max-width:none}
.m .hero .lab{top:40px;left:12px;right:8px;font-size:9px;letter-spacing:.06em}
.m .stats .grid4{grid-template-columns:1fr 1fr;row-gap:calc(var(--u)*4)}
.m .wh{flex-direction:column;align-items:flex-start}
.m .pnl{padding:12px}
.m .info p{-webkit-line-clamp:3}
.m .sv{grid-template-columns:1fr;gap:4px}
.m .cta{flex-direction:column;align-items:flex-start}
.m .arc a,.m .arc button{grid-template-columns:1fr auto}.m .arc small{display:none}.m .arc .lab,.m .arc b{display:none}
.m .xp{grid-template-columns:1fr;gap:4px}
.m .skills{grid-template-columns:1fr}
.m .mrow,.m .drow,.m .dread{grid-template-columns:1fr}
.m .sec,.m .dm{padding-left:16px;padding-right:16px}
/* lock cover */
.lock{position:absolute;inset:0;z-index:4;background:linear-gradient(#f4f4f4,#fafafa 40%,#eee);overflow:hidden}
.lock .ph{position:absolute;inset:34% 0 0;display:flex;align-items:flex-end;justify-content:center;font:400 calc(var(--wc)*.5)/.8 var(--display);color:#e6e6e6}
.lock img{position:absolute;left:0;bottom:0;width:100%;height:76%;object-fit:cover;object-position:46% 100%}
.lock .top{position:absolute;top:7%;left:0;right:0;text-align:center;z-index:1}
.lock .time{font:400 calc(var(--wc)*.23)/1 var(--display)}
.lock .sub{font-size:calc(var(--wc)*.031);margin-top:calc(var(--wc)*.028)}

<script type="text/markdown" id="md-freshroute">
Forecasts demand for perishable products, flags stock at risk of expiring, and recommends reorder quantities and markdown timing. Tested in a simulator against standard inventory rules.

## Highlights

- On synthetic data across 5 random datasets, at the same 93% availability, waste drops from 12.8% to 4.4%.
- At default settings, fill rate rises from 91.2% to 99.0% and profit rises by 22.9% on average.
- The XGBoost forecast has a 21.6% WAPE, against 26.3% for a 28-day moving average.
- Forecasting and expiry-aware ordering give most of the gain. Smart markdown then cuts waste further.

## Limitations

Synthetic data, one store, and an assumed customer response to discounts. Real sales data is the next step.
</script>
<script type="text/markdown" id="md-citybrain">
Traffic lights that learn instead of following fixed timers. PPO agents control a 2x2 city grid in SUMO and are tested against fixed-time and actuated signals, including on traffic they never saw in training.

Results come from a single seed per method.

## Highlights

- On heavy traffic, waiting inside the network is about 15 to 20% lower than actuated signals, also on unseen traffic.
- Under overload, the learned policy completed about 55% more trips than actuated.
- On light traffic the actuated controller is still better.
- Sharing neighbour information did not help in this run.

## Next

5 seeds with confidence intervals, a max-pressure baseline and larger grids.

Built with SUMO, SUMO-RL, Stable-Baselines3 and PettingZoo.
</script>
<script type="text/markdown" id="md-neurolens">
A research system for brain MRI analysis: segment suspicious regions, estimate how confident the model is, and generate a radiology-style evidence report, with an agent that flags uncertain cases for human review.

*Research prototype for learning and experimentation. Not a medical device, and not for diagnosis or any clinical decision.*

## Pipeline

MRI scan (4 modalities) → 3D segmentation → uncertainty and confidence score → agent quality check → evidence report, or a flag for human review when confidence stays low.

## Segmentation model

- **Data:** Medical Segmentation Decathlon, Task 01 Brain Tumour, with 484 labelled multimodal cases (FLAIR, T1w, T1gd, T2w).
- **Model:** a 3D SegResNet with dropout, trained with Dice + cross-entropy loss, AdamW, cosine learning-rate decay and mixed precision. Validation uses sliding-window inference and per-class Dice.
- **Preprocessing:** reorientation, z-score normalisation per modality, and random 96×96×96 patches with flip and intensity augmentation.

## Results

Baseline on Google Colab (T4 GPU): 100 training cases, 20 validation cases, 20 epochs.

| Class | Dice |
|---|---|
| Edema | 0.720 |
| Enhancing tumour | 0.693 |
| Non-enhancing tumour | 0.433 |
| **Mean** | **0.615** |

Mean Dice rose steadily from 0.179 at epoch 4 to 0.615 at epoch 20, and non-enhancing tumour is the hardest class. This is a single run on a subset of the data, so the numbers are indicative rather than a benchmark.

Built with PyTorch and MONAI. Dataset: Antonelli et al., Nature Communications, 2022.
</script>
<script type="text/markdown" id="md-learnsphere">
An agentic GenAI-powered personalised learning platform. It reads learner behaviour, predicts the next skill a student needs, and guides them through an AI mentor.

Built by a team of three as a B.Tech CSE (Data Science) project at Amity University, Noida: a Minor Project in Semester VII that grew into the Major Project in Semester VIII (Aug 2025 to Mar 2026). Supervisor: Prof. (Dr.) Dolly Sharma.

## How it works

- The React client sends learner activity to a Flask API.
- The ML engine returns a probability for each of 50 STEM skills, and the most likely next skill drives the recommendation.
- A generative-AI mentor answers questions through the backend.

## Team

- **Joya Parveen:** machine learning and data science (clustering, knowledge tracing, inference).
- **Anushka Srivastava:** backend and systems (Flask API, Docker, Nginx, fault tolerance, security).
- **Arpita:** frontend and visualisation (React 18, TypeScript, Vite, Tailwind, Three.js dashboards, quiz modals, speech recognition).

## Results

Next-skill prediction on EdNet (50 skills):

| Model | Accuracy | AUC-ROC | Epochs | Latency |
|---|---|---|---|---|
| Random baseline | 2.0% | 0.500 | n/a | < 1 ms |
| Bi-LSTM | 23.4% | 0.755 | 28 | ~45 ms |
| Transformer | 26.1% | 0.901 | 10 | ~12 ms |

The Transformer converges in 2.8× fewer epochs and serves predictions 3.75× faster than the Bi-LSTM. On the Open University dataset (32,593 learners), K-Means plus DBSCAN noise filtering raised the silhouette score from 0.357 to 0.689.

## Research output

Co-authored manuscript: "Agentic GenAI-Powered Personalized Learning: A Review and Framework", submitted to WIREs Data Mining and Knowledge Discovery and currently under review.

Built with Python, PyTorch, Flask, React, TypeScript and Docker.
</script>
<script type="text/markdown" id="md-energy">
Forecasting hourly German electricity load 24 hours ahead, comparing statistical models, gradient boosting and an LSTM, with a time-based evaluation that avoids leakage.

## Highlights

- LightGBM with lag, holiday and weather features is the best model: test MAE 1,275 MWh, about 53% lower than the "same hour last week" baseline (2,710).
- The LSTM matched it on validation but degraded on unseen test data (MAE 1,548).
- Holiday features cut validation error by about 5%, and weather by another 4%.

## Limitations

Uses observed rather than forecast weather, and gives point forecasts only.
</script>
<script type="text/markdown" id="md-rag">
Ask questions about university study programs and get answers with cited sources from official module handbooks. The system says so when the answer isn't in the documents. A retrieval-augmented generation project built around measuring quality.

## Highlights

- Three real handbooks (KIT, TU Dortmund, TU Braunschweig) parsed into about 900 module-level chunks.
- Dense retrieval reaches Hit@1 of 0.893, against 0.571 for keyword search. Hybrid has the best Recall@5 (0.946).
- Evaluated on a 33-question gold set that includes unanswerable questions.

## Limitations

Small gold set, no reranker yet, and questions that need a whole-handbook overview aren't solved. Answer-quality scoring is still pending.

Built with Python, PyMuPDF, sentence-transformers, rank-bm25 and Ollama / Claude API. Handbooks belong to their universities, so always check the official documents.
</script>
<script type="text/markdown" id="md-fraud-detection">
Detects fraudulent credit card transactions on a highly imbalanced dataset (284,807 transactions, 0.17% fraud) using Logistic Regression, Decision Tree, Random Forest and XGBoost.

## Results (test set, 98 frauds)

| Model | Fraud recall | Fraud precision | Avg precision |
|---|---|---|---|
| Logistic Regression | 0.918 | 0.061 | 0.719 |
| Decision Tree | 0.847 | 0.059 | 0.451 |
| Random Forest | 0.765 | 0.949 | 0.856 |
| XGBoost | 0.837 | 0.626 | 0.853 |

## Takeaways

- Random Forest and XGBoost clearly beat the simpler models.
- Random Forest raises only 4 false alarms, while XGBoost catches more fraud (82 vs 75) with more false alarms.
- Accuracy is misleading on imbalanced data, so recall, precision and PR-AUC are used.

Built with Python, pandas, scikit-learn and XGBoost.
</script>
<script type="text/markdown" id="md-sentiment-analysis">
Binary sentiment classification of movie reviews, built by fine-tuning `distilbert-base-uncased` on the IMDB dataset using Hugging Face Transformers.

## Results

Trained on 2,000 reviews and evaluated on 500 held-out reviews (CPU only).

| Metric | Score |
|---|---|
| Accuracy | 86.8% |
| F1 | 0.867 |

| Class | Precision | Recall | F1 |
|---|---|---|---|
| NEGATIVE | 0.879 | 0.858 | 0.869 |
| POSITIVE | 0.857 | 0.878 | 0.867 |

## Limitations

- Trained on only 2,000 reviews, so accuracy is lower than a full-data run.
- IMDB has only positive and negative labels, so neutral or mixed reviews get forced into one class, usually with low confidence.
- Trained on movie reviews, so performance may drop on other domains.

## Tech stack

Python, PyTorch, Hugging Face Transformers and Datasets, scikit-learn, matplotlib, seaborn

<script type="text/markdown" id="md-sentinel-ai">
Sentinel-AI is an autonomous multi-agent system designed to automate the end-to-end workflow of a financial data analyst. By orchestrating specialized AI agents, it transforms raw market data into structured, actionable investment intelligence.

## Live website

[sentinel-ai-neon-six.vercel.app](https://sentinel-ai-neon-six.vercel.app/)

## Data analysis & quantitative focus

This project demonstrates advanced data analyst competencies by automating complex analytical tasks:

- **Quantitative modeling:** Automated calculation of key technical indicators including RSI (Relative Strength Index), 50/200-day Moving Averages, and Beta (Market Risk).
- **NLP sentiment analysis:** Real-time processing of financial news streams to perform sentiment scoring and bias detection across multiple intelligence sources.
- **Risk assessment:** Dynamic modeling of volatility scores and P/E ratios to evaluate investment safety and market positioning.
- **Agentic data synthesis:** Implementation of a "Master Orchestrator" pattern that simulates a team of analysts (Researcher, Analyst, Quant, Editor) to ensure data integrity and multi-perspective validation.

## The agentic workflow

The system uses a sophisticated agentic logic to "think" through market problems:

1. **The Researcher:** Gathers live price data and news via Google Search grounding.
2. **The Analyst:** Critically reviews news for bias and identifies emerging market trends.
3. **The Quant:** Performs mathematical modeling of technical indicators and financial health.
4. **The Editor:** Synthesizes all findings into a professional-grade investment brief.

## Tech stack

- **Language:** TypeScript / React 18
- **AI engine:** Google Gemini API (with Google Search Grounding)
- **Visualization:** Recharts (time-series & sentiment gauges)
- **Styling:** Tailwind CSS v4
- **Animation:** Framer Motion

<script type="text/markdown" id="md-attrition-analysis">
Uses Python and statistical hypothesis testing on an HR dataset (1,470 employees, 35 features) to find what is associated with employee attrition.

## Findings

- **Overtime:** employees working overtime left at about 30.5%, against 10.4% without overtime (chi-square 87.56, p ≈ 8.16e-21).
- **Income:** employees who left earned significantly lower monthly income (t = -6.20, p ≈ 7.15e-10).

## Recommendations

Monitor teams with heavy overtime, review pay for lower-paid groups, and balance workloads.

Built with Python, Pandas, NumPy, Matplotlib, Seaborn and SciPy.

/* ---------- tiny markdown renderer for READMEs ---------- */
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function inl(s){s=esc(s);
 s=s.replace(/!\[([^\]]*)\]\(([^)\s]+)\)/g,'<img alt="$1" src="$2">');
 s=s.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
 return s.replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>').replace(/(^|[^*])\*([^*]+)\*/g,'$1<i>$2</i>')}
function md(t){var L=t.replace(/\r/g,'').split('\n'),o=[],i=0,list=null;
 function end(){if(list){o.push('</'+list+'>');list=null}}
 while(i<L.length){var l=L[i],h,li;
  if(/^\s*\|/.test(l)&&i+1<L.length&&/^\s*\|[\s:|-]+\|\s*$/.test(L[i+1])){end();
   var cells=function(x){return x.trim().replace(/^\|/,'').replace(/\|$/,'').split('|').map(function(c){return c.trim()})};
   var hd=cells(l),t='<div class="tbl"><table><thead><tr>'+hd.map(function(c){return '<th>'+inl(c)+'</th>'}).join('')+'</tr></thead><tbody>';i+=2;
   while(i<L.length&&/^\s*\|/.test(L[i])){t+='<tr>'+cells(L[i]).map(function(c){return '<td>'+inl(c)+'</td>'}).join('')+'</tr>';i++}
   o.push(t+'</tbody></table></div>');continue}
  if(/^```/.test(l)){end();var c=[];i++;while(i<L.length&&!/^```/.test(L[i]))c.push(esc(L[i++]));i++;o.push('<pre><code>'+c.join('\n')+'</code></pre>');continue}
  if(h=/^(#{1,4})\s+(.*)/.exec(l)){end();var n=Math.min(h[1].length+1,4);o.push('<h'+n+'>'+inl(h[2])+'</h'+n+'>');i++;continue}
  if(li=/^\s*(?:[-*]|\d+\.)\s+(.*)/.exec(l)){var tp=/^\s*\d/.test(l)?'ol':'ul';if(list!==tp){end();o.push('<'+tp+'>');list=tp}o.push('<li>'+inl(li[1])+'</li>');i++;continue}

  var sideW=vc/2-m-(Wp/2-tuck);
  var szR=Math.min(100*sideW/b100,vh*.4);
  var szL=Math.min(100*sideW/a100,szR*1.4,vh*.4);
  nl.style.fontSize=szL+'px';nr.style.fontSize=szR+'px';
  NDX=0} /* phone stays exactly centred; names tuck against it on both sides */
 nl.style.textAlign='right';nr.style.textAlign='left';
  var wl=nl.getBoundingClientRect().width,wr=nr.getBoundingClientRect().width;
 var nw=Math.ceil(Math.max(wl,wr));nl.style.width=nr.style.width=nw+'px';
 /* same size for both; names tuck slightly behind the phone edges */
 
 orbit.style.setProperty('--R',Math.min(vw*.4,Wp*1.2+120)+'px');
 measure()}
function update(){
 var vw=M.vw,s=clamp(-track.getBoundingClientRect().top,0,T.total),U=T.U,E=U+room;
 var o=sm(s,.1*U,.85*U)-sm(s,E+.08*T.C,E+.75*T.C),h=1-o,th=180*h;
 pL.style.transform='rotateY('+th+'deg)';
 asm.style.transform='translateX('+(-M.Wp/2*h)+'px)';
 var sx=(-NDX*h)+'px';dev.style.transform=names.style.transform='translateX('+sx+')';orbit.style.marginLeft=glowEl.style.marginLeft=sx;
 dev.style.setProperty('--rh',(2+(M.R-2)*h)+'px');dev.style.setProperty('--ph',(4*h)+'px');
 dev.style.setProperty('--pb',(10*h)+'px');dev.style.setProperty('--rs',((M.R-14)*h)+'px');var open=o>.04;pR.classList.toggle('off',!open);frontF.classList.toggle('off',!open);backF.classList.toggle('off',o>.5);
 dev.style.setProperty('--o',o*clamp((1-o)*6,0,1));
 var d=o*vw*.55,vis=1-sm(o,.15,.6);
 nl.style.transform='translateX('+(-d)+'px)';
 nr.style.transform='translateX('+d+'px)';
 names.style.opacity=vis;root.setProperty('--oo',vis);M.o=o;root.setProperty('--fl',1-clamp(o*5,0,1));
 $('ground').style.setProperty('--gw',(M.Wp*(1+o)*.92)+'px');glowEl.style.setProperty('--gw2',(M.Wp*(2.1+1.0*o))+'px');root.setProperty('--gv',1-.4*o);
 if(orbitOn&&reduce)orbitFrame(0);
 var ty=clamp(s-U,0,room);
 if(!view.p&&!counted&&statsTop!=null&&ty+M.sh*.8>statsTop){counted=true;if(reduce)setCounts(1);else runCount()}
 cL.style.transform=cR.style.transform='translateY('+(-ty)+'px)';
 var c=sm(s,E+.5*T.C,E+.88*T.C);call.style.opacity=c;call.style.pointerEvents=c>.5?'auto':'none';
 /* active nav, status bar tone, active project row */
 var key=view.p?'work':'home',t=ty+M.sh*.35,i,tone='l';
 for(i=0;i<secs.length;i++)if(secs[i].t<=t)key=secs[i].k;
 for(i=0;i<ths.length;i++)if(ths[i].t<=ty+30)tone=ths[i].k;
 [fL,fR].forEach(function(f){f.classList.toggle('lt',tone==='l');[].forEach.call(f.querySelectorAll('.nav button'),function(b){b.classList.toggle('on',b.dataset.g===key)})});
 if(!view.p){var ctr=ty+M.sh*.4;for(i=0;i<rows.length;i++)if(ctr>=rows[i].t&&ctr<rows[i].b){if(i!==lastAuto){lastAuto=i;act=i;applyAct()}break}}
}
function goTo(k,instant){
 if(view.p){view={};render(false)}
 var y=0;
 if(k!=='home'){var el=cL.querySelector('[data-s='+k+']');if(el)y=clamp(el.offsetTop-8,0,room)}
 scrollTo({top:track.offsetTop+T.U+y,behavior:instant?'instant':'smooth'});update()}

/* count-up numbers in "In numbers" */
function setCounts(p){[cL,cR].forEach(function(c){[].forEach.call(c.querySelectorAll('[data-n]'),function(e){var n=parseFloat(e.dataset.n),dec=e.dataset.n.indexOf('.')>-1,v=1+(n-1)*p;e.textContent=dec?v.toFixed(1):Math.round(v)})})}
function runCount(){var t0=performance.now(),D=1300;(function f(now){var p=Math.min(1,(now-t0)/D);p=1-Math.pow(1-p,3);setCounts(p);if(p<1)requestAnimationFrame(f)})(t0)}
/* work page filter */
function applyFilter(re){[cL,cR].forEach(function(c){[].forEach.call(c.querySelectorAll('.wcard'),function(k){k.classList.toggle('hid',wf!=='all'&&k.dataset.cat!==wf)});[].forEach.call(c.querySelectorAll('.fchips button'),function(b){b.classList.toggle('on',b.dataset.f===wf)})});if(re!==false)measure()}
/* brief form: both screen halves hold a copy, so keep their values in sync */
function syncField(e){var t=e.target;if(!t.dataset||!t.dataset.k)return;var other=cL.contains(t)?cR:cR.contains(t)?cL:null;if(!other)return;var o=other.querySelector('[data-k="'+t.dataset.k+'"]');if(o&&o.value!==t.value)o.value=t.value}
document.addEventListener('input',syncField,true);document.addEventListener('change',syncField,true);
function openMail(subj,body){var url='mailto:arpitaa.0214@gmail.com?subject='+encodeURIComponent(subj)+'&body='+encodeURIComponent(body);var framed=false;try{framed=window.self!==window.top}catch(x){framed=true}
 if(framed){try{navigator.clipboard.writeText('arpitaa.0214@gmail.com')}catch(x){}toast('Email copied: arpitaa.0214@gmail.com. Paste it into your email app.');return}
 try{window.location.href=url}catch(x){}toast('Opening your email app. If nothing opens, write to arpitaa.0214@gmail.com')}
function submitBrief(){var g=function(k){var e=cL.querySelector('[data-k="'+k+'"]');return e?e.value.trim():''};
 var name=g('name'),email=g('email'),topic=g('topic'),msg=g('msg');
 if(!email||email.indexOf('@')<1){toast('Please add your email so I can reply.');return}
 openMail('Portfolio: '+(topic||'hello')+(name?' from '+name:''),(msg||'Hi Arpita,')+'\n\n'+(name?name+'\n':'')+email)}
/* slide to talk (incoming call screen) */
$('avimg').src=ME;
(function(){var slide=$('slide'),knob=$('knob'),x=0,drag=false,sx=0;
 function max(){return slide.clientWidth-knob.offsetWidth-2*parseFloat(getComputedStyle(knob).left)}
 function put(v,anim){x=v;knob.style.transition=anim?'transform .35s cubic-bezier(.2,.8,.2,1)':'none';knob.style.transform='translateX('+v+'px)'}
 function answer(){openMail('Portfolio: let\'s talk','Hi Arpita,');setTimeout(function(){put(0,true)},900)}
 knob.addEventListener('pointerdown',function(e){drag=true;sx=e.clientX-x;try{knob.setPointerCapture(e.pointerId)}catch(z){}});
 knob.addEventListener('pointermove',function(e){if(drag)put(clamp(e.clientX-sx,0,max()),false)});
 var end=function(){if(!drag)return;drag=false;if(x>max()*.82){put(max(),true);answer()}else put(0,true)};
 knob.addEventListener('pointerup',end);knob.addEventListener('pointercancel',end);
 knob.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();put(max(),true);answer()}})})();
/* orbit mode: project tiles (and a portrait) circle the phone */
var SIZES=[.2,.16,.22,.17,.19,.21,.18];
function buildOrbit(){orbit.innerHTML='';tiles=[];
 var items=PROJECTS.slice(0,6).map(function(p,i){return{c:p.c,html:'<span class="vis" style="--c:'+p.c+'">'+art(i)+'</span>'}});
 items.splice(3,0,{c:'#e9e9e9',html:'<img src="'+ME+'" alt="">'});
 items.forEach(function(it){var d=document.createElement('span');d.className='tile';d.style.setProperty('--c',it.c);d.innerHTML=it.html;orbit.appendChild(d);tiles.push(d)})}
var t0o=performance.now();
function orbitFrame(now){
 var t=reduce?0:(now-t0o)/1000,n=tiles.length,Wp=M.Wp,H=M.H,o=M.o||0,Rx=Wp*(1.28+.5*o),Ry=H*.42;
 tiles.forEach(function(d,i){var a=t*2*Math.PI/80+i*2*Math.PI/n,sn=Math.sin(a),sz=Wp*SIZES[i%7]*(.88+.14*sn),rot=9*Math.sin(a*1.7+i);
  d.style.width=sz+'px';d.style.height=(sz*1.14)+'px';
  d.style.transform='translate('+(Math.cos(a)*Rx-sz/2)+'px,'+(sn*Ry-sz*.57)+'px) rotate('+rot+'deg)';
  d.style.zIndex=sn>.45?4:2});
 if(orbitOn&&!reduce)requestAnimationFrame(orbitFrame)}
buildOrbit();
function hist(u){try{history.pushState(null,'',u)}catch(e){}}
function openProject(slug,push){
 view={p:slug};if(push!==false)hist('#'+slug);
 render(true);scrollTo({top:track.offsetTop+T.U,behavior:'instant'});update()}

 view={};if(push!==false)hist(location.pathname+location.search);
 render(true);goTo('work',true)}

 var f=e.target.closest('[data-f]');if(f){wf=f.dataset.f;applyFilter();update();return}

 if(e.target.closest('[data-back]')){closeProject();return}
 var r=e.target.closest('.row');
 if(r){var i=+r.dataset.r;if(i===act)openProject(PROJECTS[i].slug);else{act=i;applyAct()}}});
$('stage').addEventListener('mouseover',function(e){var r=e.target.closest('.row');if(r&&+r.dataset.r!==act){act=+r.dataset.r;applyAct()}});
$('stage').addEventListener('focusin',function(e){var r=e.target.closest('.row');if(r&&+r.dataset.r!==act){act=+r.dataset.r;applyAct()}});

 if(!a||!/^https?:/.test(a.href))return;

},true);
